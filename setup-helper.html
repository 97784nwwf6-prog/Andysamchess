<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One-time setup — Andy and Sam Chess</title>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0b1229;
    color:#f2efff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    padding:24px;
    text-align:center;
  }
  h1{font-size:22px;margin-bottom:8px;}
  p{color:#b8b3e6;max-width:420px;line-height:1.5;}
  button{
    font-size:18px;font-weight:700;
    background:linear-gradient(160deg,#ffd24c,#ffb03c);
    color:#0b1229;border:none;border-radius:14px;
    padding:16px 28px;margin-top:20px;cursor:pointer;
  }
  button:disabled{opacity:.5;}
  .result{
    margin-top:24px;padding:18px;background:#161b3d;border:2px dashed #4fd8eb;
    border-radius:14px;font-family:monospace;font-size:16px;word-break:break-all;
    max-width:420px;display:none;
  }
  .status{margin-top:14px;font-weight:700;min-height:20px;}
  .error{color:#ff5f7e;}
  .success{color:#5fffb0;}
</style>
</head>
<body>
  <h1>🚀 One-time setup</h1>
  <p>Tap the button below. It creates a free, private storage bucket for Andy and Sam's chess game to use. It only needs to be done once, ever.</p>
  <button id="btn">Create Database</button>
  <div class="status" id="status"></div>
  <div class="result" id="result"></div>

<script>
document.getElementById('btn').addEventListener('click', async () => {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  btn.disabled = true;
  status.textContent = 'Creating…';
  status.className = 'status';
  try {
    const res = await fetch('https://kvdb.io/', { method: 'POST' });
    if (!res.ok) throw new Error('Server responded with ' + res.status);
    const bucketId = (await res.text()).trim();
    if (!bucketId || bucketId.length < 5) throw new Error('Unexpected response: ' + bucketId);
    status.textContent = '✅ Done! Copy this and send it back:';
    status.className = 'status success';
    result.textContent = bucketId;
    result.style.display = 'block';
  } catch (e) {
    status.textContent = '⚠️ Something went wrong: ' + e.message + ' — try again, or check your connection.';
    status.className = 'status error';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
